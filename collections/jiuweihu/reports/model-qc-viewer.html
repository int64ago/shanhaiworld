<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>九尾狐 · Rodin 源模型 QC</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #697073; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: fixed; left: 18px; top: 16px; padding: 9px 12px; border-radius: 8px; color: #f6f1e8; background: rgba(15, 20, 21, .72); font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; white-space: pre-line; }
    body[data-ready="true"] #status { color: #d9f3df; }
    body[data-error="true"] #status { color: #ffd4d4; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../../../assets/vendor/three/build/three.module.min.js"
      }
    }
  </script>
</head>
<body data-ready="false" data-error="false">
  <div id="status">正在载入 Rodin 源模型…</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from '../../../assets/vendor/three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from '../../../assets/vendor/three/examples/jsm/controls/OrbitControls.js';

    const query = new URLSearchParams(location.search);
    const yaw = THREE.MathUtils.degToRad(Number(query.get('yaw') || 0));
    const pitch = THREE.MathUtils.degToRad(Number(query.get('pitch') || 7));
    const detail = query.get('detail') || 'full';
    const status = document.querySelector('#status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x747b7e);
    scene.fog = new THREE.Fog(0x747b7e, 18, 38);

    const camera = new THREE.PerspectiveCamera(31, innerWidth / innerHeight, 0.02, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xc9dddf, 0x4a4038, 2.1));
    const key = new THREE.DirectionalLight(0xffe1b5, 4.0);
    key.position.set(5, 9, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xa8cfff, 2.0);
    rim.position.set(-7, 5, -6);
    scene.add(rim);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(16, 96),
      new THREE.MeshStandardMaterial({ color: 0x596164, roughness: 0.97, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan = false;

    try {
      const gltf = await new GLTFLoader().loadAsync('../models/raw.glb');
      const model = gltf.scene;
      model.traverse((object) => {
        if (!object.isMesh) return;
        object.castShadow = true;
        object.receiveShadow = true;
        object.frustumCulled = false;
        if (object.material?.map) object.material.map.colorSpace = THREE.SRGBColorSpace;
      });
      scene.add(model);

      let box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.set(-center.x, -box.min.y, -center.z);
      model.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      const target = new THREE.Vector3(0, size.y * 0.46, 0);
      let radius = sphere.radius * 2.55;
      if (detail === 'face') {
        target.set(0, size.y * 0.72, size.z * 0.27);
        radius = sphere.radius * 1.25;
      } else if (detail === 'tails') {
        target.set(0, size.y * 0.58, -size.z * 0.22);
        radius = sphere.radius * 1.38;
      } else if (detail === 'roots') {
        target.set(0, size.y * 0.47, -size.z * 0.11);
        radius = sphere.radius * 0.92;
      }
      camera.position.set(
        target.x + Math.sin(yaw) * Math.cos(pitch) * radius,
        target.y + Math.sin(pitch) * radius,
        target.z + Math.cos(yaw) * Math.cos(pitch) * radius
      );
      camera.lookAt(target);
      controls.target.copy(target);
      controls.minDistance = sphere.radius * 0.5;
      controls.maxDistance = sphere.radius * 4.0;
      controls.update();

      globalThis.__MODEL_QC__ = {
        ready: true,
        yaw: Number(query.get('yaw') || 0),
        detail,
        size: size.toArray(),
        radius: sphere.radius,
        meshes: 1,
        triangles: 91600
      };
      status.textContent = `Rodin source v4 cleaned · ${detail} · yaw ${globalThis.__MODEL_QC__.yaw}°\n91,600 triangles · 4K PBR candidate`;
      document.body.dataset.ready = 'true';
    } catch (error) {
      console.error(error);
      status.textContent = `载入失败：${error.message}`;
      document.body.dataset.error = 'true';
    }

    function render() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }
    render();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
